config_version = 16

[battery]
warning_threshold = 20

[calendar]
enabled = true

    [calendar.account.loghenrie]
    color = "primary"
    type = "google"

[lockscreen]
fingerprint = false
grace_period_seconds = 1

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 682.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."0lucasmatheus/awwwall"]
transition_type = "fade"

[plugins]
enabled = [ "0lucasmatheus/awwwall" ]

[shell]
polkit_agent = true
show_close_buttons = false
telemetry_enabled = true

    [shell.launcher.providers.calculator]
    prefix = "="

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "helix", "niri" ]

[wallpaper]
directory = "/home/logan/Downloads"

    [wallpaper.default]
    path = "/home/logan/Downloads/Clouds.gif"

    [wallpaper.last]
    path = "/home/logan/Downloads/Clouds.gif"

    [wallpaper.monitors.eDP-1]
    path = "/home/logan/Downloads/Clouds.gif"